# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
android.suppressUnsupportedCompileSdk=34

# Kotlin
kotlin.code.style=official
ksp.incremental=true

# Pin KSP to legacy mode (KSP1) for stability with Room + Moshi codegen.
# KSP2 produces "unexpected jvm signature V" errors with Room 2.7.x as of late 2025.
ksp.useKSP2=false
