name: Build Android APK

on:
  # Manual trigger: GitHub → Actions → Build Android APK → Run workflow
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug or release-unsigned)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release-unsigned

  # Also build on pushes to main and on PRs.
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # v5+ of these actions run on Node 24, which clears the
      # "Node.js 20 is deprecated" annotations.
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Correct input name (the old `accept-android-licenses` is invalid → warning).
          accept-android-sdk-licenses: true
          packages: 'platforms;android-35 build-tools;35.0.0'

      # setup-gradle caches ~/.gradle itself (gradle-home, dependencies, transforms…).
      # The old extra actions/cache step was redundant — it only produced duplicate
      # cache entries (and extra failure noise during GitHub cache outages), so it's gone.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-read-only: false

      - name: Restore google-services.json (secret override)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # The repo ships a real app/google-services.json (client identifiers only).
          # If the GOOGLE_SERVICES_JSON secret is set, it takes precedence.
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
            echo "google-services.json restored from secret (overrides committed file)."
          else
            echo "Using committed app/google-services.json."
          fi
          # Safety net for forks that strip the file.
          if [ ! -f app/google-services.json ]; then
            echo '::warning::No google-services.json found — writing a placeholder. Firebase features will be disabled at runtime.'
            echo '{"project_info":{"project_number":"","project_id":"placeholder","storage_bucket":"placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000000000","android_client_info":{"package_name":"com.studyinfo.app"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyBogusKeyForBuildOnly0000000000000"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Run unit tests
        run: gradle test --no-daemon --stacktrace

      - name: Build APK
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
        run: |
          if [ "$BUILD_TYPE" = "release-unsigned" ]; then
            gradle assembleRelease --no-daemon --stacktrace
            mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/PrepVault-release-unsigned.apk || true
          else
            gradle assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/PrepVault-debug.apk
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: PrepVault-APK-${{ github.event.inputs.build_type || 'debug' }}-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.run_number }}
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          retention-days: 7
